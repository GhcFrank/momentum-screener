[project]
name = "momentum-screener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gooder", email = "ghcgooder@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "exchange-calendars>=4.13.2",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "scipy>=1.16.0",
    "structlog>=26.1.0",
    "ta>=0.11.0",
    "tenacity>=9.1.4",
    "yfinance>=1.5.2",
]

[project.scripts]
momentum-screener = "momentum_screener:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
