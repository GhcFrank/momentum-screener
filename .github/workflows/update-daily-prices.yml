name: Update daily prices

on:
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "America/New_York"
    - cron: "30 21 * * 1-5"
      timezone: "America/New_York"
    - cron: "30 0 * * 2-6"
      timezone: "America/New_York"
    - cron: "30 5 * * 2-6"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: daily-price-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  update-daily-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      RELEASE_TAG: marketData
      RPS_RELEASE_TAG: rpsData
      MARKET_CAP_RELEASE_TAG: marketCapData
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install project Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Resolve attempt and skip completed session
        id: preflight
        env:
          DAILY_SCHEDULE: ${{ github.event.schedule }}
        run: >-
          uv run python -m momentum_screener.daily_update preflight
          --repository "${{ github.repository }}"
          --release-tag "${RELEASE_TAG}"
          --work-dir "$RUNNER_TEMP"

      - name: Validate local Universe
        id: universe
        if: success() && steps.preflight.outputs.action == 'run'
        run: uv run python -m momentum_screener.universe validate

      - name: Verify local and remote dataset identity
        id: price_identity
        if: success() && steps.preflight.outputs.action == 'run'
        run: >-
          uv run python -m momentum_screener.release_storage check
          --repository "${{ github.repository }}"
          --release-tag "${RELEASE_TAG}"
          --result-json "$RUNNER_TEMP/dataset-check-before.json"

      - name: Restore update inputs from Release
        id: price_restore
        if: success() && steps.preflight.outputs.action == 'run'
        run: >-
          uv run python -m momentum_screener.release_storage pull-update-inputs
          --repository "${{ github.repository }}"
          --release-tag "${RELEASE_TAG}"

      - name: Plan daily refresh without Yahoo access
        id: price_plan
        if: success() && steps.preflight.outputs.action == 'run'
        run: >-
          uv run python -m momentum_screener.prices update --dry-run
          --target-date "${{ steps.preflight.outputs.target_session }}"
          --result-json "$RUNNER_TEMP/price-update-plan.json"

      - name: Refresh daily prices
        if: success() && steps.preflight.outputs.action == 'run'
        id: refresh
        run: >-
          uv run python -m momentum_screener.daily_update prices
          --work-dir "$RUNNER_TEMP"

      - name: Validate incremental update acceptance
        id: price_acceptance
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true' && steps.refresh.outputs.publish == 'true'
        run: >-
          uv run python -c
          "from pathlib import Path; from momentum_screener.release_storage import
          validate_local_incremental_update_acceptance;
          root=Path('data/processed/prices');
          validate_local_incremental_update_acceptance(prices_root=root)"

      - name: Verify remote RPS dataset
        id: rps_identity
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        run: >-
          uv run python -m momentum_screener.rps_release_storage check
          --repository "${{ github.repository }}"
          --release-tag "${RPS_RELEASE_TAG}"
          --result-json "$RUNNER_TEMP/rps-check-before.json"

      - name: Restore RPS history from Release
        id: rps_restore
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        run: >-
          uv run python -m momentum_screener.rps_release_storage pull
          --repository "${{ github.repository }}"
          --release-tag "${RPS_RELEASE_TAG}"

      - name: Restore MarketCap history or prepare first snapshot
        id: market_cap_restore
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        run: >-
          uv run python -m momentum_screener.market_cap_release_storage pull
          --repository "${{ github.repository }}"
          --release-tag "${MARKET_CAP_RELEASE_TAG}"
          --allow-bootstrap
          --result-json "$RUNNER_TEMP/market-cap-pull.json"

      - name: Refresh MarketCap for the latest successful price session
        id: market_cap_refresh
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        run: >-
          uv run python -m momentum_screener.market_cap_storage refresh
          --result-json "$RUNNER_TEMP/market-cap-refresh.json"

      - name: Persist RPS and prepare daily screening signals
        id: screening_prepare
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        run: >-
          uv run python -m momentum_screener.daily_screening_notification
          --as-of-date "${{ steps.preflight.outputs.target_session }}"
          --prepare-email "$RUNNER_TEMP/prepared-screening.json"
          --result-json "$RUNNER_TEMP/daily-screening-prepared.json"

      - name: Publish update to Release
        id: price_publish
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true' && steps.refresh.outputs.publish == 'true'
        run: >-
          uv run python -m momentum_screener.release_storage publish-update
          --repository "${{ github.repository }}"
          --release-tag "${RELEASE_TAG}"
          --result-json "$RUNNER_TEMP/release-publish-result.json"

      - name: Verify remote manifest after update
        id: price_verify
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        run: >-
          uv run python -m momentum_screener.release_storage check
          --repository "${{ github.repository }}"
          --release-tag "${RELEASE_TAG}"
          --result-json "$RUNNER_TEMP/dataset-check-after.json"

      - name: Publish MarketCap history to Release
        id: market_cap_publish
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        run: >-
          uv run python -m momentum_screener.market_cap_release_storage publish
          --repository "${{ github.repository }}"
          --release-tag "${MARKET_CAP_RELEASE_TAG}"
          --allow-bootstrap
          --result-json "$RUNNER_TEMP/market-cap-publish.json"

      - name: Publish RPS history to Release
        id: rps_publish
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        run: >-
          uv run python -m momentum_screener.rps_release_storage publish
          --repository "${{ github.repository }}"
          --release-tag "${RPS_RELEASE_TAG}"
          --result-json "$RUNNER_TEMP/rps-publish-result.json"

      - name: Verify remote RPS manifest after update
        id: rps_verify
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        run: >-
          uv run python -m momentum_screener.rps_release_storage check
          --repository "${{ github.repository }}"
          --release-tag "${RPS_RELEASE_TAG}"
          --result-json "$RUNNER_TEMP/rps-check-after.json"

      - name: Send screening and mark session complete
        if: success() && steps.preflight.outputs.action == 'run' && steps.refresh.outputs.ready == 'true'
        id: notify
        env:
          RPS_SMTP_HOST: smtp.gmail.com
          RPS_SMTP_PORT: "587"
          RPS_SMTP_USERNAME: ${{ secrets.GMAIL_USER }}
          RPS_SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RPS_EMAIL_FROM: ${{ secrets.GMAIL_USER }}
          RPS_EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: >-
          uv run python -m momentum_screener.daily_update notify
          --repository "${{ github.repository }}"
          --release-tag "${RELEASE_TAG}"
          --work-dir "$RUNNER_TEMP"

      - name: Notify failure only on the final scheduled attempt
        if: >-
          always() && !cancelled() && github.event_name == 'schedule' &&
          github.event.schedule == '30 5 * * 2-6' &&
          steps.preflight.outputs.action != 'skip' &&
          (failure() || steps.refresh.outputs.ready == 'false')
        env:
          DAILY_STEP_OUTCOMES: ${{ toJSON(steps) }}
          RPS_SMTP_HOST: smtp.gmail.com
          RPS_SMTP_PORT: "587"
          RPS_SMTP_USERNAME: ${{ secrets.GMAIL_USER }}
          RPS_SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RPS_EMAIL_FROM: ${{ secrets.GMAIL_USER }}
          RPS_EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: >-
          uv run python -m momentum_screener.daily_update final-failure
          --repository "${{ github.repository }}"
          --release-tag "${RELEASE_TAG}"
          --work-dir "$RUNNER_TEMP"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          uv run python - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          print('## Daily update attempt')
          for name in ('daily-attempt', 'daily-preflight-result', 'daily-prices-result',
                       'daily-screening-prepared', 'release-publish-result',
                       'market-cap-publish', 'rps-publish-result',
                       'daily-notify-result', 'daily-final-failure-result'):
              path = root / (name + '.json')
              if path.is_file():
                  print(f'### {name}\n```json\n{json.dumps(json.loads(path.read_text()), indent=2)}\n```')
          PYTHON

      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-price-update-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            data/processed/prices/update_report.json
            data/processed/prices/update_missing_tickers.csv
            data/processed/prices/release_publish_plan.json
            data/processed/prices/sync_report.json
            data/processed/prices/manifest.json
            data/processed/prices/.update_diagnostics/**
            data/processed/rps/manifest.json
            data/processed/market_cap/manifest.json
            data/processed/market_cap/missing_tickers.csv
            ${{ runner.temp }}/market-cap-pull.json
            ${{ runner.temp }}/market-cap-refresh.json
            ${{ runner.temp }}/market-cap-publish.json
            ${{ runner.temp }}/dataset-check-before.json
            ${{ runner.temp }}/dataset-check-after.json
            ${{ runner.temp }}/price-update-plan.json
            ${{ runner.temp }}/daily-*.json
            ${{ runner.temp }}/release-publish-result.json
            ${{ runner.temp }}/rps-check-before.json
            ${{ runner.temp }}/rps-publish-result.json
            ${{ runner.temp }}/rps-check-after.json
